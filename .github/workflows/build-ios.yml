name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo Prebuild (Generate Native iOS)
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: npx pod-install ios

      - name: Build and Package Unsigned IPA
        run: |
          mkdir -p build
          cd ios
          
          echo "=== iOS Directory Contents ==="
          ls -la
          
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -n 1)
          PROJECT=$(ls -d *.xcodeproj 2>/dev/null | head -n 1)
          SCHEME=$(basename "$PROJECT" .xcodeproj)
          
          echo "Discovered Workspace: '$WORKSPACE'"
          echo "Discovered Project: '$PROJECT'"
          echo "Discovered Scheme: '$SCHEME'"
          
          if [ -n "$WORKSPACE" ]; then
            TARGET_ARG="-workspace $WORKSPACE"
          else
            TARGET_ARG="-project $PROJECT"
          fi
          
          echo "Target argument: $TARGET_ARG"
          
          xcodebuild archive \
            $TARGET_ARG \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "../build/FinanzasAI.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO
            
          cd ..
          
          mkdir -p Payload
          APP_PATH=$(find build/FinanzasAI.xcarchive/Products/Applications -name "*.app" -type d | head -n 1)
          echo "Found compiled app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r -y FinanzasAI.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinanzasAI-iOS-IPA
          path: FinanzasAI.ipa
          retention-days: 7
