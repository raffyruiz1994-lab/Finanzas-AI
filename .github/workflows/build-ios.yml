name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo Prebuild (Generate Native iOS & CocoaPods)
        run: npx expo prebuild --platform ios --clean

      - name: Build and Package Unsigned IPA
        run: |
          mkdir -p build
          cd ios
          
          # Auto-detect workspace and scheme
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -n 1)
          SCHEME=$(basename $(ls -d *.xcodeproj 2>/dev/null | head -n 1) .xcodeproj)
          
          echo "Detected Workspace: $WORKSPACE"
          echo "Detected Scheme: $SCHEME"
          
          # Build archive without signing
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "../build/FinanzasAI.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO
            
          cd ..
          
          # Package into IPA
          mkdir -p Payload
          cp -r build/FinanzasAI.xcarchive/Products/Applications/*.app Payload/
          zip -r -y FinanzasAI.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinanzasAI-iOS-IPA
          path: FinanzasAI.ipa
          retention-days: 7
